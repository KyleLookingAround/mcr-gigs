<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCR Gigs — Manchester live music, this week and next</title>
    <meta
      name="description"
      content="A fast, no-nonsense finder for live gigs in central Manchester. Filter by room size, price and genre, match to your Last.fm taste, save gigs and export to your calendar."
    />
    <meta name="theme-color" content="#c8341c" />
    <link rel="canonical" href="https://mcr-gigs.netlify.app/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="MCR Gigs — Manchester live music" />
    <meta
      property="og:description"
      content="Live gigs in central Manchester, filtered to your taste. This week and next."
    />
    <meta property="og:url" content="https://mcr-gigs.netlify.app/" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="mast-row">
        <span id="mast-no" title="go on then">№ 001 / Manchester</span>
        <span id="last-updated">—</span>
      </div>
      <h1>MCR&nbsp;GIGS</h1>
      <div class="subhead">
        <span class="italic">Live music, this week and next.</span>
        <span class="accent">Powered by Skiddle</span>
      </div>
    </header>

    <div class="filters">
      <div class="filter-row" role="group" aria-label="Time window">
        <span class="filter-label" title="How far ahead to load gigs from the source">Window</span>
        <button class="chip" data-window="7" aria-pressed="false">Next 7d</button>
        <button class="chip" data-window="14" aria-pressed="false">Next 14d</button>
        <button class="chip" data-window="30" aria-pressed="false">Next 30d</button>
        <button class="chip" data-window="60" aria-pressed="false">Next 60d</button>
        <button class="chip" data-window="90" aria-pressed="false">Next 90d</button>
        <button class="chip" data-window="180" aria-pressed="false">Next 180d</button>
        <button class="chip" data-window="365" aria-pressed="false">Next 365d</button>
      </div>
      <div class="filter-row" id="month-row" style="display: none" role="group" aria-label="Month">
        <span class="filter-label" title="Filter the already-loaded gigs down to one month"
          >Month</span
        >
        <div id="month-chips" style="display: contents"></div>
      </div>
      <div class="filter-row" role="group" aria-label="Room size">
        <span class="filter-label">Room size</span>
        <button class="chip" data-size="small" aria-pressed="false">Small (≤300)</button>
        <button class="chip" data-size="mid" aria-pressed="false">Mid (300–1200)</button>
        <button class="chip" data-size="large" aria-pressed="false">Large (1200+)</button>
        <button class="chip" data-size="unknown" aria-pressed="false">Unknown</button>
      </div>
      <div class="filter-row" id="foryou-row" role="group" aria-label="For you">
        <span class="filter-label">For you</span>
        <button class="chip accent" data-foryou="saved" aria-pressed="false">★ Saved</button>
        <button
          class="chip accent"
          data-foryou="you"
          id="fy-you"
          style="display: none"
          aria-pressed="false"
        >
          ♪ Your artists
        </button>
        <button
          class="chip accent"
          data-foryou="similar"
          id="fy-similar"
          style="display: none"
          aria-pressed="false"
        >
          ≈ Similar
        </button>
      </div>
      <div class="filter-row" id="genre-row" style="display: none" role="group" aria-label="Genres">
        <span class="filter-label">Genres</span>
        <div id="genre-chips" style="display: contents"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Last.fm</span>
        <input
          type="text"
          class="search-box lastfm-input"
          id="lastfm-user"
          placeholder="your last.fm username"
          aria-label="Last.fm username"
          autocomplete="off"
        />
        <button class="chip" id="lastfm-btn">Connect</button>
        <span class="lastfm-status" id="lastfm-status" aria-live="polite"></span>
      </div>
      <div class="filter-row">
        <span class="filter-label">Search</span>
        <input
          type="text"
          class="search-box"
          id="search-box"
          placeholder="artist, venue, anything…"
          aria-label="Search gigs"
        />
        <div class="price-control">
          <label class="filter-label" for="price-range">Max <span id="price-val">£60</span></label>
          <input
            type="range"
            id="price-range"
            min="5"
            max="100"
            value="60"
            step="5"
            aria-describedby="price-note"
          />
          <span class="price-note" id="price-note"></span>
        </div>
        <button class="refresh-btn" id="refresh-btn">↻ Refresh</button>
      </div>
    </div>

    <div class="status-bar">
      <div class="count"><span class="num" id="visible-count">0</span> gigs</div>
      <div class="meta" id="status-meta" aria-live="polite">—</div>
    </div>

    <div id="error-container" aria-live="assertive"></div>

    <main id="results" aria-label="Gig results" aria-live="polite"></main>

    <footer>
      <span>Data: Skiddle Events API</span>
      <span>Proxied through Netlify Edge Functions</span>
      <span>Cached 5 min at the edge &amp; in your browser</span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
