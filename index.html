<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCR Gigs — Manchester live music, this week and next</title>
    <meta
      name="description"
      content="A fast, no-nonsense finder for live gigs in central Manchester. Filter by room size, price and genre, match to your Last.fm taste, save gigs and export to your calendar."
    />
    <meta name="theme-color" content="#c8341c" />
    <link rel="canonical" href="https://mcr-gigs.netlify.app/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="MCR Gigs — Manchester live music" />
    <meta
      property="og:description"
      content="Live gigs in central Manchester, filtered to your taste. This week and next."
    />
    <meta property="og:url" content="https://mcr-gigs.netlify.app/" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="mast-row">
        <span>№ 001 / Manchester</span>
        <span id="last-updated">—</span>
      </div>
      <h1>MCR&nbsp;GIGS</h1>
      <div class="subhead">
        <span class="italic">Live music, this week and next.</span>
        <span class="accent">Powered by Skiddle</span>
      </div>
    </header>

    <div class="filters">
      <div class="filter-row">
        <span class="filter-label">Window</span>
        <button class="chip" data-window="7">Next 7d</button>
        <button class="chip" data-window="14">Next 14d</button>
        <button class="chip" data-window="30">Next 30d</button>
        <button class="chip" data-window="60">Next 60d</button>
        <button class="chip" data-window="90">Next 90d</button>
        <button class="chip" data-window="180">Next 180d</button>
        <button class="chip" data-window="365">Next 365d</button>
      </div>
      <div class="filter-row" id="month-row" style="display: none">
        <span class="filter-label">Month</span>
        <div id="month-chips" style="display: contents"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Room size</span>
        <button class="chip" data-size="small">Small (≤300)</button>
        <button class="chip" data-size="mid">Mid (300–1200)</button>
        <button class="chip" data-size="large">Large (1200+)</button>
        <button class="chip" data-size="unknown">Unknown</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">Group by</span>
        <button class="chip" data-group="day">Day</button>
        <button class="chip" data-group="month">Month</button>
      </div>
      <div class="filter-row" id="foryou-row">
        <span class="filter-label">For you</span>
        <button class="chip accent" data-foryou="saved">★ Saved</button>
        <button class="chip accent" data-foryou="you" id="fy-you" style="display: none">
          ♪ Your artists
        </button>
        <button class="chip accent" data-foryou="similar" id="fy-similar" style="display: none">
          ≈ Similar
        </button>
      </div>
      <div class="filter-row" id="genre-row" style="display: none">
        <span class="filter-label">Genres</span>
        <div id="genre-chips" style="display: contents"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Last.fm</span>
        <input
          type="text"
          class="search-box lastfm-input"
          id="lastfm-user"
          placeholder="your last.fm username"
          autocomplete="off"
        />
        <button class="chip" id="lastfm-btn">Connect</button>
        <span class="lastfm-status" id="lastfm-status" aria-live="polite"></span>
      </div>
      <div class="filter-row">
        <span class="filter-label">Search</span>
        <input
          type="text"
          class="search-box"
          id="search-box"
          placeholder="artist, venue, anything…"
        />
        <div class="price-control">
          <label class="filter-label" for="price-range">Max <span id="price-val">£60</span></label>
          <input type="range" id="price-range" min="5" max="100" value="60" step="5" />
        </div>
        <button class="refresh-btn" id="refresh-btn">↻ Refresh</button>
      </div>
    </div>

    <div class="status-bar">
      <div class="count"><span class="num" id="visible-count">0</span> gigs</div>
      <div class="meta" id="status-meta" aria-live="polite">—</div>
    </div>

    <div id="error-container" aria-live="assertive"></div>

    <main id="results"></main>

    <footer>
      <span>Data: Skiddle Events API</span>
      <span>Proxied through Netlify Edge Functions</span>
      <span>Cached 5 min at the edge &amp; in your browser</span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
